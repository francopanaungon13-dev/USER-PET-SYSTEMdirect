<html>
    <head>
<script src="shared-storage.js"></script>
<title>Happy Paws - Create Account</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
    </head>

<body> <div class="auth-card">
<div class="logo">🐾 Happy Paws</div>
<h2>Create Account</h2>
<form id="registerForm">
<label>Full Name</label>
<input type="text" id="fullname" required>
<label>Email Address</label>
<input type="email" id="regEmail" required>
<label>Password</label>
<input type="password" id="regPassword" minlength="6" required>
<label>Confirm Password</label>
<input type="password" id="confirmPassword" minlength="6" required>
<button type="submit">Register</button>
</form>
<p class="center">Already have an account? <a href="index.html">Login</a></p>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
