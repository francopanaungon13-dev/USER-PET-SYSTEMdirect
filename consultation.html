<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Happy Paws - Consultation</title>
    <link rel="stylesheet" href="styles.css">
    <script src="shared-storage.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf5ff, #f7fbff, #e3f4f5);
            color: #26384a;
            min-height: 100vh;
        }

        .topbar {
            background: #ffffff;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 4px 18px rgba(30, 90, 140, 0.10);
            border-bottom: 3px solid #b8e5f5;
        }

        .logo {
            color: #0878cf;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: #456078;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #0784d8;
        }

        .container {
            width: min(1050px, 92%);
            margin: 40px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }

        .panel {
            background: rgba(255, 255, 255, 0.96);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #d7eaf7;
            box-shadow: 0 10px 30px rgba(43, 105, 150, 0.10);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: "";
            display: block;
            width: 65px;
            height: 5px;
            background: linear-gradient(90deg, #0788df, #59c9d5);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1, h2 {
            color: #0878cf;
            margin-top: 0;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 22px;
        }

        p {
            color: #687c8f;
            line-height: 1.7;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-size: 14px;
            font-weight: bold;
            color: #35536c;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbdfee;
            border-radius: 11px;
            background: #f7fbff;
            color: #26384a;
            font-family: Arial, sans-serif;
            font-size: 14px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #1596e5;
            box-shadow: 0 0 0 3px rgba(21, 150, 229, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 130px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #0788df, #13b5c5);
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(8, 136, 223, 0.20);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 18px rgba(8, 136, 223, 0.27);
        }

        #consultationList {
            display: grid;
            gap: 14px;
        }

        #consultationList .pet-card {
            padding: 18px;
            border-radius: 14px;
            border: 1px solid #dcecf7;
            border-left: 4px solid #17a4d5;
            background: #f7fbff;
        }

        #consultationList h3 {
            color: #0878cf;
            margin-top: 0;
        }

        #consultationList .status {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fff1cc;
            color: #946500;
            font-size: 12px;
            font-weight: bold;
        }

        @media (max-width: 750px) {
            .topbar {
                padding: 18px 5%;
                align-items: flex-start;
            }

            nav {
                gap: 14px;
            }

            .container {
                grid-template-columns: 1fr;
                margin: 25px auto;
            }

            .panel {
                padding: 23px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="logo" href="home.html">🐾 Happy Paws</a>
        <nav>
            <a href="home.html">Home</a>
            <a href="pets.html">My Pets</a>
            <a href="services.html">Services</a>
        </nav>
    </header>

    <main class="container">
        <div class="panel">
            <h1>🐾 Pet Consultation</h1>
            <p>We're here to help your furry friend. Tell us what's concerning you and submit a consultation request.</p>

            <form id="consultationForm">
                <label for="consultPet">Pet Name</label>
                <input type="text" id="consultPet" required placeholder="Enter your pet's name">

                <label for="consultConcern">Describe Your Concern</label>
                <textarea id="consultConcern" rows="5" required placeholder="Tell us about your pet's symptoms or concern..."></textarea>

                <button type="submit">Submit Consultation →</button>
            </form>
        </div>

        <div class="panel">
            <h2>📋 My Consultation Requests</h2>
            <div id="consultationList"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
