<html>
    <head>
<script src="shared-storage.js"></script>
        <title>Happy Paws - Book Appointment</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="topbar">
            <a class="logo" href="home.html">🐾 Happy Paws</a>
            <nav>
                <a href="home.html">Home</a>
                <a href="pets.html">My Pets</a>
                <a href="appointments.html">Appointments</a>
            </nav>
        </header>

        <main class="container">
            <div class="panel">
                <h1>Book an Appointment</h1>
                <form id="appointmentForm">
                    <label>Select Pet</label>
                    <select id="appointmentPet" required>
                        <option value="">Choose your pet</option>
                    </select>

                    <label>Service</label>
                    <select id="appointmentService" required>
                        <option value="">Choose a service</option>
                        <option>General Checkup</option>
                        <option>Vaccination</option>
                        <option>Grooming</option>
                        <option>Dental Care</option>
                        <option>Consultation</option>
                    </select>

                    <label>Appointment Date</label>
                    <input type="date" id="appointmentDate" required>

                    <label>Preferred Time</label>
                    <input type="time" id="appointmentTime" required>

                    <label>Additional Notes</label>
                    <textarea id="appointmentNotes" rows="3"></textarea>

                    <button type="submit">Submit Request</button>
                    <a class="button-link" href="appointments.html">Cancel</a>
                </form>
            </div>
        </main>
<script type="module" src="app.js"></script>
    </body>
</html>
